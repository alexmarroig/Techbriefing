name: PR Image Audit

on:
  pull_request:
    paths:
      - 'src/content/articles/**'
      - 'public/images/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  audit-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit article images
        run: npm run audit:images

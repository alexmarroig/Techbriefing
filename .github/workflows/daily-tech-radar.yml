name: Daily Tech Radar

on:
  schedule:
    # 11:00 in Sao Paulo (UTC-3). GitHub schedules use UTC.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tech-radar
  cancel-in-progress: false

jobs:
  publish-radar:
    runs-on: ubuntu-latest
    env:
      RADAR_TIMEZONE: America/Sao_Paulo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate radar and curate cover
        id: radar
        shell: bash
        run: |
          set +e
          DATE=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          SLUG="radar-tech-${DATE}"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

          npm run radar:tech
          radar_status=$?

          if [ "$radar_status" -ne 0 ]; then
            echo "Radar generation skipped or failed (${radar_status})."
          fi

          if [ -f "src/content/articles/${SLUG}.md" ]; then
            npm run curate:images -- --apply --slug "${SLUG}" --skip-remote
            npm run og:images -- --slug "${SLUG}"
          else
            echo "No radar markdown for ${SLUG}; skipping curate:images."
          fi

          set -e

          npm run audit:images

          if git diff --quiet -- src/content/articles public/images/radar public/images/news public/images/og public/assets/og-default.webp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.radar.outputs.changed == 'true'
        run: npm run build

      - name: Commit daily radar
        if: steps.radar.outputs.changed == 'true'
        run: |
          git config user.name "tech-briefing-bot"
          git config user.email "actions@github.com"
          git add src/content/articles public/images/radar public/images/news public/images/og public/assets/og-default.webp
          git commit -m "Add daily tech radar (${{ steps.radar.outputs.date }})"
          git push

      - name: Nothing to publish
        if: steps.radar.outputs.changed != 'true'
        run: echo "No new radar post or cover changes for ${{ steps.radar.outputs.slug }}."

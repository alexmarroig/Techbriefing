  <title id="title">Codex em ambientes corporativos</title>
  <desc id="desc">Arte editorial mostrando agentes de código em uma infraestrutura empresarial segura.</desc>
  <rect width="1200" height="675" fill="#080d10"/>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 155) rotate(35) scale(820 540)">
